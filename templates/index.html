<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Log Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>AI Log Analyzer</h1>

        <p class="subtitle">
            Detect abnormal server log patterns using Machine Learning
        </p>

        <!-- Upload Section -->
        <div class="upload-box">

            <input type="file" id="logFile" accept=".csv">

            <button onclick="analyzeLogs()">
                Analyze Logs
            </button>

        </div>


        <!-- Dashboard -->
        <div class="dashboard">

            <div class="card">
                <h3>Total Logs</h3>
                <p id="totalLogs">0</p>
            </div>

            <div class="card">
                <h3>Anomalies</h3>
                <p id="anomalies">0</p>
            </div>

            <div class="card">
                <h3>Critical</h3>
                <p id="critical">0</p>
            </div>

        </div>


        <!-- Loading -->
        <div id="loading">
            Analyzing logs...
        </div>


        <!-- Error -->
        <div id="error"></div>


        <!-- Results -->
        <div class="results">

            <h2>Analysis Results</h2>

            <table>

                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Level</th>
                        <th>Message</th>
                        <th>CPU</th>
                        <th>RAM</th>
                        <th>Severity</th>
                        <th>Score</th>
                    </tr>
                </thead>

                <tbody id="resultsBody">
                </tbody>

            </table>

        </div>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
